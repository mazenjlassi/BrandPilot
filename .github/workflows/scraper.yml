name: Daily Scraper

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      companyName:
        description: 'Company to scrape (leave empty for all)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: node run-scrape.js
        env:
          HEADLESS: 'true'
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}
          COMPANY_NAME: ${{ inputs.companyName || '' }}
