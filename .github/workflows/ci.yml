name: CI

on:
  push:
    branches: [ main, ci/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./scraper/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, scraper]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: metatry
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn package -DskipTests -B
        working-directory: ./backend
      - name: Start backend
        shell: bash
        run: |
          set +e
          echo "::error::SCRIPT BEGINS"
          java -version
          echo "::error::Starting backend"
          mkdir -p /tmp/javatmp
          java \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            --add-opens java.base/java.util=ALL-UNNAMED \
            --add-opens java.base/java.io=ALL-UNNAMED \
            --add-opens java.base/java.net=ALL-UNNAMED \
            --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
            --add-opens java.base/sun.net.www.protocol.jar=ALL-UNNAMED \
            --add-opens java.base/java.util.concurrent=ALL-UNNAMED \
            -Djava.io.tmpdir=/tmp/javatmp \
            -jar target/metaTry-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          JPID=$!
          echo "::error::PID=$JPID"
          sleep 5
          kill -0 $JPID 2>/dev/null; AL=$?; echo "::error::ALIVE=$AL"
          wait $JPID 2>/dev/null; EC=$?; echo "::error::EC=$EC"
          echo "::error::CRASH:"
          if [ -f /tmp/metatry-crash.log ]; then
            wc -l /tmp/metatry-crash.log | while read n f; do echo "::error::crash lines=$n"; done
            echo "::error::MAIN:"
            sed -n '1,5p' /tmp/metatry-crash.log | while IFS= read -r line; do echo "::error::$line"; done
            c=$(grep -c "^--- Cause\[" /tmp/metatry-crash.log || true)
            s=$(grep -c "^--- Suppressed\[" /tmp/metatry-crash.log || true)
            echo "::error::Cause entries: $c, Suppressed entries: $s"
            if [ "$c" -gt 0 ]; then
              echo "::error::FIRST CAUSE:"
              awk '/^--- Cause\[0\] ---/,0' /tmp/metatry-crash.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
              echo "::error::LAST CAUSE:"
              tac /tmp/metatry-crash.log | awk '/^--- Cause\[/{c++; if(c==1){print; while(getline && $0 !~ /^--- (Cause|Suppressed)/ && $0 !~ /^===/) print; exit}}' | tac | head -15 | while IFS= read -r line; do echo "::error::$line"; done
            fi
            echo "::error::TAIL:"
            tail -5 /tmp/metatry-crash.log | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::no crash log"
          fi
          echo "::error::STDOUT:"
          if [ -f /tmp/backend.log ]; then
            wc -c /tmp/backend.log | while read n f; do echo "::error::stdout $n bytes"; done
            head -5 /tmp/backend.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          echo "::error::SPRING LOGS:"
          find /tmp -name spring.log 2>/dev/null | while IFS= read -r f; do
            echo "::error::found $f ($(wc -c < $f) bytes)"
            head -5 "$f" | while IFS= read -r line; do echo "::error::$line"; done
          done
          echo "::error::ALL DONE"
        working-directory: ./backend
      - name: Wait for backend
        run: timeout 120 sh -c 'until curl -s http://localhost:8081/auth/login > /dev/null 2>&1; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./e2e/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - name: Start frontend
        run: |
          nohup npx ng serve --port 4200 --host 0.0.0.0 --disable-host-check > frontend.log 2>&1 &
          echo "Frontend PID: $!"
        working-directory: ./frontend
      - name: Wait for frontend
        run: timeout 120 sh -c 'until curl -s http://localhost:4200 > /dev/null 2>&1; do sleep 3; done'
      - run: npm ci
        working-directory: ./e2e
      - run: npm test
        working-directory: ./e2e
