name: CI

on:
  push:
    branches: [ main, ci/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./scraper/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, scraper]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: metatry
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn package -DskipTests -B
        working-directory: ./backend
      - name: Start backend
        run: |
          java -version
          ls -la target/metaTry-0.0.1-SNAPSHOT.jar
          echo "=== Starting backend in background ==="
          java -Djava.security.egd=file:/dev/urandom -jar target/metaTry-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          JPID=$!
          echo "Java PID: $JPID"
          sleep 5; echo "=== After 5s ==="
          ss -tlnp 2>/dev/null | grep 8081 || netstat -tlnp 2>/dev/null | grep 8081 || echo "port 8081 not listening"
          if kill -0 $JPID 2>/dev/null; then
            echo "::error::=== THREAD DUMP 1 (5s) ==="
            $JAVA_HOME/bin/jstack -l $JPID 2>&1 | head -60 | while IFS= read -r line; do echo "::error::td1 $line"; done
            sleep 10
            echo "::error::=== PORT CHECK (15s) ==="
            (ss -tlnp 2>/dev/null | grep -q 8081 && echo "port 8081 OPEN" || echo "port 8081 NOT OPEN") | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::=== THREAD DUMP 2 (15s) ==="
            $JAVA_HOME/bin/jstack -l $JPID 2>&1 | head -60 | while IFS= read -r line; do echo "::error::td2 $line"; done
            sleep 15
            echo "::error::=== PORT CHECK (30s) ==="
            (ss -tlnp 2>/dev/null | grep -q 8081 && echo "port 8081 OPEN" || echo "port 8081 NOT OPEN") | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::=== THREAD DUMP 3 (30s) ==="
            $JAVA_HOME/bin/jstack -l $JPID 2>&1 | head -60 | while IFS= read -r line; do echo "::error::td3 $line"; done
            sleep 20
            echo "::error::=== AFTER 50s ==="
            (ss -tlnp 2>/dev/null | grep -q 8081 && echo "port 8081 OPEN" || echo "port 8081 NOT OPEN") | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::PROCESS DIED BEFORE 5s"
            wait $JPID 2>/dev/null || true
          fi
          if kill -0 $JPID 2>/dev/null; then
            echo "::error::PROCESS STILL ALIVE AFTER 50s"
          fi
          echo "=== Full backend log ==="
          while IFS= read -r line; do echo "::error::$line"; done < /tmp/backend.log
          echo "=== hs_err files ==="
          find . /tmp -name "hs_err_pid*" 2>/dev/null | head -5 || echo "(none found)"
          echo "Backend exited"
        working-directory: ./backend
      - name: Wait for backend
        run: timeout 120 sh -c 'until curl -s http://localhost:8081/auth/login > /dev/null 2>&1; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./e2e/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - name: Start frontend
        run: |
          nohup npx ng serve --port 4200 --host 0.0.0.0 --disable-host-check > frontend.log 2>&1 &
          echo "Frontend PID: $!"
        working-directory: ./frontend
      - name: Wait for frontend
        run: timeout 120 sh -c 'until curl -s http://localhost:4200 > /dev/null 2>&1; do sleep 3; done'
      - run: npm ci
        working-directory: ./e2e
      - run: npm test
        working-directory: ./e2e
