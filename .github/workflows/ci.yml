name: CI

on:
  push:
    branches: [ main, ci/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./scraper/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, scraper]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: metatry
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn package -DskipTests -B
        working-directory: ./backend
      - name: Start backend
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/javatmp
          mkdir -p $PWD/config
          jar xf target/metaTry-0.0.1-SNAPSHOT.jar BOOT-INF/classes/application.properties 2>/dev/null; mv -f BOOT-INF/classes/application.properties $PWD/config/ 2>/dev/null; rm -rf BOOT-INF 2>/dev/null; ls -la $PWD/config/
          java \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            --add-opens java.base/java.util=ALL-UNNAMED \
            --add-opens java.base/java.io=ALL-UNNAMED \
            --add-opens java.base/java.net=ALL-UNNAMED \
            --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
            --add-opens java.base/sun.net.www.protocol.jar=ALL-UNNAMED \
            --add-opens java.base/java.util.concurrent=ALL-UNNAMED \
            -Djava.io.tmpdir=/tmp/javatmp \
            -Dspring.datasource.url="jdbc:mysql://localhost:3306/metatry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -Dspring.datasource.username=root \
            -Dspring.datasource.password=rootpassword \
            -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver \
            -jar target/metaTry-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          JPID=$!; sleep 5; wait $JPID 2>/dev/null; EC=$?
          if [ -f /tmp/metatry-crash.log ]; then
            lines=$(wc -l < /tmp/metatry-crash.log)
            c=$(grep -c "^--- Cause\[" /tmp/metatry-crash.log || true)
            s=$(grep -c "^--- Suppressed\[" /tmp/metatry-crash.log || true)
            echo "::error::C:$c EC:$EC"
            awk '/^--- Cause\[/{h=$0; getline; print h " -> " $0}' /tmp/metatry-crash.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
        working-directory: ./backend
      - name: Wait for backend
        run: timeout 120 sh -c 'until curl -s http://localhost:8081/auth/login > /dev/null 2>&1; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./e2e/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - name: Start frontend
        run: |
          nohup npx ng serve --port 4200 --host 0.0.0.0 --disable-host-check > frontend.log 2>&1 &
          echo "Frontend PID: $!"
        working-directory: ./frontend
      - name: Wait for frontend
        run: timeout 120 sh -c 'until curl -s http://localhost:4200 > /dev/null 2>&1; do sleep 3; done'
      - run: npm ci
        working-directory: ./e2e
      - run: npm test
        working-directory: ./e2e
