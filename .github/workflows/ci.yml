name: CI

on:
  push:
    branches: [ main, ci/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./scraper/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, scraper]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: metatry
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn package -DskipTests -B
        working-directory: ./backend
      - name: Start backend
        run: |
          echo "::error::SCRIPT BEGINS"
          java -version
          echo "::error::Starting backend"
          java -Djava.io.tmpdir=/tmp/javatmp -jar target/metaTry-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          JPID=$!
          echo "::error::PID=$JPID"
          sleep 5
          kill -0 $JPID 2>/dev/null; echo "::error::ALIVE=$?"
          wait $JPID 2>/dev/null; EC=$?
          echo "::error::EC=$EC"
          echo "::error::CRASH:"
          cat /tmp/metatry-crash.log 2>/dev/null | head -30 | while IFS= read -r line; do echo "::error::cr $line"; done || echo "::error::no crash log"
          echo "::error::STDOUT:"
          wc -l /tmp/backend.log 2>/dev/null | while IFS= read -r line; do echo "::error::sze $line"; done
          head -100 /tmp/backend.log 2>/dev/null | while IFS= read -r line; do echo "::error::ol $line"; done || echo "::error::no stdout"
          echo "::error::SPRING LOG:"
          cat /tmp/javatmp/spring.log 2>/dev/null | while IFS= read -r line; do echo "::error::sl $line"; done || echo "::error::no spring log"
          echo "::error::ALL DONE"
        working-directory: ./backend
      - name: Wait for backend
        run: timeout 120 sh -c 'until curl -s http://localhost:8081/auth/login > /dev/null 2>&1; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./e2e/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - name: Start frontend
        run: |
          nohup npx ng serve --port 4200 --host 0.0.0.0 --disable-host-check > frontend.log 2>&1 &
          echo "Frontend PID: $!"
        working-directory: ./frontend
      - name: Wait for frontend
        run: timeout 120 sh -c 'until curl -s http://localhost:4200 > /dev/null 2>&1; do sleep 3; done'
      - run: npm ci
        working-directory: ./e2e
      - run: npm test
        working-directory: ./e2e
