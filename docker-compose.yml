services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: metatry
      POSTGRES_USER: metatry
      POSTGRES_PASSWORD: metatry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metatry"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metatry
      SPRING_DATASOURCE_USERNAME: metatry
      SPRING_DATASOURCE_PASSWORD: metatry
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
